apiVersion: deploy.cloud.google.com/v1
kind: DeliveryPipeline
metadata:
  name: surf-delivery-pipeline
description: Pipeline for Quiver and Wave Surf App
serialPipeline:
  stages:
    - targetId: dev
      profiles: [dev]
    - targetId: prod
      profiles: [prod]
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: dev
description: Development Environment
run:
  location: projects/${PROJECT_ID}/locations/us-central1
---
apiVersion: deploy.cloud.google.com/v1
kind: Target
metadata:
  name: prod
description: Production Environment (Requires approval gate)
run:
  location: projects/${PROJECT_ID}/locations/us-central1
