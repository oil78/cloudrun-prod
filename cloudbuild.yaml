steps:
  # Build the container image using Cloud Build commit/build ID as tag
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/run-artifacts/surf-app:$BUILD_ID'
      - '.'
      
  # Push the immutable artifact to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - '${_REGION}-docker.pkg.dev/$PROJECT_ID/run-artifacts/surf-app:$BUILD_ID'

  # Register and launch the release into Cloud Deploy
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud deploy releases create surf-release-$BUILD_ID \
          --delivery-pipeline=surf-delivery-pipeline \
          --region=${_REGION} \
          --images=app-image=${_REGION}-docker.pkg.dev/$PROJECT_ID/run-artifacts/surf-app:$BUILD_ID

images:
  - '${_REGION}-docker.pkg.dev/$PROJECT_ID/run-artifacts/surf-app:$BUILD_ID'

options:
  logging: CLOUD_LOGGING_ONLY
